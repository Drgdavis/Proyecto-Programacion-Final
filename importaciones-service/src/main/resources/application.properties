spring.application.name=importaciones-service
server.port=8082

# Base de datos propia del servicio
spring.datasource.url=jdbc:mysql://localhost:3306/importaciones_db
spring.datasource.username=importaciones_app
spring.datasource.password=${IMPORTACIONES_DB_PASSWORD}

# Las tablas se administran mediante scripts SQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Registro y descubrimiento
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# Limites de recepcion de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Historial y operaciones de importacion
spring.cloud.gateway.server.webflux.routes[1].id=importaciones
spring.cloud.gateway.server.webflux.routes[1].uri=lb://importaciones-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/importaciones,/api/importaciones/**

# Evitar repetir automaticamente un lote que modifica productos
spring.cloud.loadbalancer.retry.enabled=false