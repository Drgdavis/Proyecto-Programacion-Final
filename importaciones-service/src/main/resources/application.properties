spring.application.name=importaciones-service
server.port=8082

# Base de datos propia del servicio
spring.datasource.url=jdbc:mysql://localhost:3306/importaciones_db
spring.datasource.username=importaciones_app
spring.datasource.password=${IMPORTACIONES_DB_PASSWORD}

# Las tablas se administran mediante scripts SQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Registro y descubrimiento
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# Limites de recepcion de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Evitar repetir automaticamente un lote que modifica productos
spring.cloud.loadbalancer.retry.enabled=false

# Documentacion de la API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.override-with-generic-response=false

# Logs con Logback
logging.level.root=INFO
logging.level.com.prograiv=INFO
logging.file.name=logs/importaciones-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
