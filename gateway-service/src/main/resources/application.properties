spring.application.name=gateway-service
server.port=8080

# Registro y consulta de servicios en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# Publicamos solamente las rutas que configuramos
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Consultas y operaciones del catalogo
spring.cloud.gateway.server.webflux.routes[0].id=catalogo
spring.cloud.gateway.server.webflux.routes[0].uri=lb://catalogo-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/productos,/api/productos/**,/api/categorias,/api/categorias/**

spring.cloud.gateway.server.webflux.routes[1].id=importaciones
spring.cloud.gateway.server.webflux.routes[1].uri=lb://importaciones-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/importaciones,/api/importaciones/**

logging.file.name=logs/gateway-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB